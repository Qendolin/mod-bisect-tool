[verification_test_description]
other = "Inicia Minecraft con el grupo de mods activos actual y verifica si tu problema sigue presente.\n\n✗ Con fallos\n  El problema sigue ahí (confirma que el grupo de conflicto encontrado es correcto).\n\n✓ Funciona\n  El problema ha desaparecido (sugiere que el grupo está incompleto).\n\n? No estoy seguro\n  El juego se cerró inesperadamente o no puedes determinar si el problema sigue presente."

[bisection_test]
other = "Prueba de bisección"

[bisection_test_description]
other = "Inicia Minecraft con el grupo de mods activos actual y comprueba si tu problema se ha resuelto.\n\n✓ Funciona\n  El juego funciona bien y el problema ha desaparecido.\n\n✗ Con fallos\n  El problema sigue presente en el juego.\n\n? No estoy seguro\n  El juego se cerró inesperadamente o no puedes determinar si el problema sigue presente."

