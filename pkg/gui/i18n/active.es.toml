other = "La búsqueda no puede continuar porque los dos grupos siguientes dependen el uno del otro a través de dependencias no declaradas: al menos un mod de cada grupo necesita silenciosamente un mod del otro grupo para ejecutarse. Esta es una situación muy rara e inusual, y la herramienta no puede determinar qué grupo causa el problema.\n\nPara continuar, elimina o repara uno de los mods involucrados e inicia una nueva búsqueda."

