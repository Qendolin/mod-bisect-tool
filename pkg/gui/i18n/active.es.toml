other = "Se ha encontrado un nuevo mod en conflicto, pero aún no se sabe si hay más involucrados.\n\nYa puedes solucionar este conflicto desactivando uno de los mods anteriores.\n\nO continúa la búsqueda para verificar si el grupo de conflicto está completo."

[result_incomplete_explanation]
other = "El conflicto actual involucra más mods de los encontrados hasta ahora.\n\nYa puedes solucionar este conflicto desactivando uno de los mods anteriores.\n\nO continúa la búsqueda para encontrar los mods restantes."

