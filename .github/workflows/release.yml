on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  # --- JOB 1: Build & Release TUI Binaries (Pure Go) ---
  releases-matrix-tui:
    name: Release Go TUI Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: ./cmd/mod-bisect-tui
          binary_name: mod-bisect-tui
          compress_assets: OFF
          md5sum: FALSE
          ldflags: >
            -X 'github.com/Qendolin/fabric-mod-bisect-tool/pkg/app.AppDistribution=${{ matrix.goos }}-binary'
            -X 'github.com/Qendolin/fabric-mod-bisect-tool/pkg/app.AppVersion=${{ github.event.release.tag_name }}'
            -X 'github.com/Qendolin/fabric-mod-bisect-tool/pkg/app.AppRevision=${{ github.sha }}'

  # --- JOB 2: Build Standalone GUI Binaries ---
  releases-matrix-gui:
    name: Build GUI Release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux: native runners per arch (CGO required)
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          # Windows: pure-Go cross-compilation (CGO disabled), packaged via gogio
          - { goos: windows, goarch: amd64, runner: ubuntu-latest }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest }
          # macOS: native runners — cross-compiling macOS/CGO from Linux requires
          # a full osxcross setup that is fragile and SDK-license-constrained.
          # macos-15-intel = last Intel runner; macos-latest = Apple Silicon (arm64).
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-latest }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Linux GUI dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Install go-appimage (appimagetool)
        if: matrix.goos == 'linux'
        run: |
          case "${{ matrix.goarch }}" in
            amd64) tool_arch="x86_64" ;;
            arm64) tool_arch="aarch64" ;;
            *) echo "unsupported arch: ${{ matrix.goarch }}" ; exit 1 ;;
          esac

          asset_path=$(
            wget -q \
              https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous \
              -O - |
            grep "appimagetool-.*-${tool_arch}\.AppImage" |
            head -n 1 |
            cut -d '"' -f 2
          )

          wget -c "https://github.com/${asset_path}"
          chmod +x appimagetool-*.AppImage

      - name: Install gogio
        if: matrix.goos != 'linux'
        run: go install gioui.org/cmd/gogio@v0.10.0

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Windows is pure-Go; Linux and macOS require CGO.
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: >
          python3 scripts/build_gui.py
          --goos    ${{ matrix.goos }}
          --goarch  ${{ matrix.goarch }}
          --tag     ${{ github.event.release.tag_name }}
          --icon    cmd/mod-bisect-gui/Icon-Small.png

      # Upload binaries directly to the GitHub release (mirrors what go-release-action
      # does for the TUI job). The workflow artifact upload below is a bonus cache.
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/* --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  update-release-notes:
    name: Generate Friendly Release Dashboard
    runs-on: ubuntu-latest
    needs: [releases-matrix-tui, releases-matrix-gui]
    steps:
      - name: Inject Download Table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Create dashboard
          cat << EOF > new_release_notes.md
          ## Quick Download

          > [!IMPORTANT]
          > **macOS and Linux note:** Raw binaries need an execute bit before they can run: \`chmod +x ./mod-bisect-*\`. This is required because some downloads are saved without the execute permission enabled. On macOS, if the app is blocked by Gatekeeper, clear quarantine metadata with \`xattr -dr com.apple.quarantine "Mod-Bisect-Tool.app"\` (for the .app bundle) or with the same command on the raw binary itself.

          Select the download for your operating system. For most standard computers, the **64-bit (amd64)** or **Apple Silicon** options are what you need.  
          Using the GUI is recommended.

          | Platform | Architecture | GUI (Graphical) | TUI (Terminal) |
          | :--- | :--- | :--- | :--- |
          | **Windows** | x86_64 / amd64        | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-windows-amd64.exe) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-windows-amd64.exe) |
          | **Linux**   | x86_64 / amd64        | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-linux-amd64.AppImage) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-linux-amd64) |
          | **macOS**   | Apple Silicon (arm64) | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-darwin-arm64.zip) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-darwin-arm64) |
          | **macOS**   | Intel (x86_64)        | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-darwin-amd64.zip) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-darwin-amd64) |

          ### Other Versions

          | Platform | Architecture | GUI (Graphical) | TUI (Terminal) |
          | :--- | :--- | :--- | :--- |
          | **Windows** | arm64 / aarch64 | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-windows-arm64.exe) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-windows-arm64.exe) |
          | **Linux**   | arm64 / aarch64 | [Download](${BASE_URL}/mod-bisect-gui-${TAG}-linux-arm64.AppImage) | [Download](${BASE_URL}/mod-bisect-tui-${TAG}-linux-arm64) |

          ---

          ## How to use

          Please see the respective guide for instructions:

          [GUI User Guide](https://Qendolin.github.io/mod-bisect-tool/GUI-User-Guide.html) | [TUI User Guide](https://Qendolin.github.io/mod-bisect-tool/TUI-User-Guide.html)

          ---

          ## Release Information

          EOF

          # Fetch your original release description and append it below the table
          gh release view "${TAG}" --repo "${REPO}" --json body --jq '.body' >> new_release_notes.md

          # Update the GitHub release description
          gh release edit "${TAG}" --repo "${REPO}" --notes-file new_release_notes.md

  publish-www:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: [update-release-notes]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate website
        run: python3 scripts/generate_www.py --www www

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
